[package]
name = "engram-watch"
version = "0.1.0"
edition = "2021"

[dependencies]
engram-core = { path = "../engram-core" }
engram-ingest = { path = "../engram-ingest" }
engram-store = { path = "../engram-store" }
notify = "7"
globset = "0.4"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
git2 = "0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
