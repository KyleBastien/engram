[package]
name = "engram-provider-ollama"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
engram-core = { path = "../../engram-core" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
