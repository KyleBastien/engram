<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engram Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .status {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 600px;
            width: 100%;
        }
        .status p { margin-bottom: 0.5rem; }
        .badge {
            display: inline-block;
            background: #22c55e;
            color: #0f172a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Engram Dashboard</h1>
    <p class="subtitle">Semantic Context Engine</p>
    <div class="status">
        <p><span class="badge">RUNNING</span></p>
        <p>Dashboard server is active. Views will be added in upcoming updates.</p>
    </div>
</body>
</html>
