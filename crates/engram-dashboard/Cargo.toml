[package]
name = "engram-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
engram-core = { path = "../engram-core" }
axum = { version = "0.7", features = ["macros"] }
rust-embed = "8"
mime_guess = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
