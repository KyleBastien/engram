[package]
name = "engram-lsp"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
engram-core = { path = "../engram-core" }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
