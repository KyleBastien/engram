[package]
name = "engram-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
engram-bench = { path = "../engram-bench" }
engram-core = { path = "../engram-core" }
engram-dashboard = { path = "../engram-dashboard" }
engram-store = { path = "../engram-store" }
engram-ingest = { path = "../engram-ingest" }
engram-mcp = { path = "../engram-mcp" }
engram-query = { path = "../engram-query" }
git2 = "0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_yaml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
