[package]
name = "engram-ingest"
version = "0.1.0"
edition = "2021"

[dependencies]
engram-core = { path = "../engram-core" }
engram-lsp = { path = "../engram-lsp" }
engram-store = { path = "../engram-store" }
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
sha2 = "0.10"
git2 = "0.19"
globset = "0.4"
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
