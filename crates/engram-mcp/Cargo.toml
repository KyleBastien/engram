[package]
name = "engram-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
engram-core = { path = "../engram-core" }
engram-query = { path = "../engram-query" }
engram-store = { path = "../engram-store" }
async-trait = "0.1"
chrono = "0.4"
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
