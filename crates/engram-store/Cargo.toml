[package]
name = "engram-store"
version = "0.1.0"
edition = "2021"

[dependencies]
engram-core = { path = "../engram-core" }
git2 = "0.19"
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
